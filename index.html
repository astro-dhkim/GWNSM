<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>SCIENCE MISSION — 과학관 탐사 웹앱</title>
  <style>
    :root{
      --bg:#07111f;
      --bg-2:#0a1728;
      --panel:#0d1b2d;
      --panel-2:#11233a;
      --panel-3:#132943;
      --text:#f4f8fb;
      --muted:#9cb0c4;
      --muted-2:#6e849a;
      --line:rgba(157,185,211,.18);
      --line-strong:rgba(157,185,211,.30);
      --accent:#61d9ff;
      --accent-soft:rgba(97,217,255,.12);
      --accent-2:#6ff1c2;
      --accent-2-soft:rgba(111,241,194,.12);
      --danger:#ff7f9a;
      --danger-soft:rgba(255,127,154,.10);
      --good:#73efbe;
      --good-soft:rgba(115,239,190,.10);
      --shadow:0 24px 70px rgba(0,0,0,.34);
      --radius-xl:28px;
      --radius-lg:22px;
      --radius-md:16px;
      --tap:58px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    html{color-scheme:dark}
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(97,217,255,.16), transparent 34rem),
        radial-gradient(circle at 100% 28%, rgba(111,241,194,.08), transparent 27rem),
        linear-gradient(180deg,#07111f 0%,#081421 52%,#07101c 100%);
      overflow-x:hidden;
    }

    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible{
      outline:3px solid rgba(97,217,255,.42);
      outline-offset:3px;
    }

    .app{
      width:min(100%,760px);
      min-height:100dvh;
      margin:0 auto;
      padding:
        calc(14px + env(safe-area-inset-top))
        18px
        calc(28px + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      position:relative;
      isolation:isolate;
    }

    .app::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.12;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size:28px 28px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 82%);
      z-index:-2;
    }

    .ambient{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-1;
      overflow:hidden;
    }
    .orb{
      position:absolute;
      border-radius:999px;
      border:1px solid rgba(97,217,255,.12);
      animation:drift 9s ease-in-out infinite alternate;
    }
    .orb.o1{width:190px;height:190px;right:-90px;top:15%}
    .orb.o2{width:96px;height:96px;left:-38px;top:48%;animation-delay:-3s}
    .orb.o3{width:36px;height:36px;right:7%;top:73%;animation-delay:-5s}
    @keyframes drift{
      from{transform:translate3d(0,-5px,0)}
      to{transform:translate3d(-7px,12px,0)}
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-height:54px;
      margin-bottom:10px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .brand-mark{
      width:34px;height:34px;border-radius:12px;
      display:grid;place-items:center;
      border:1px solid rgba(97,217,255,.28);
      background:linear-gradient(145deg,rgba(97,217,255,.15),rgba(111,241,194,.06));
      box-shadow:inset 0 0 24px rgba(97,217,255,.08);
      flex:0 0 auto;
    }
    .brand-mark svg{width:19px;height:19px;color:var(--accent)}
    .brand-copy{min-width:0}
    .brand-title{
      font-size:14px;font-weight:850;letter-spacing:.09em;white-space:nowrap;
    }
    .brand-sub{
      display:block;color:var(--muted-2);font-size:10px;letter-spacing:.06em;margin-top:1px;
    }

    .ghost{
      min-height:40px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.025);
      color:var(--muted);
      border-radius:999px;
      padding:8px 12px;
      font-size:13px;
    }
    .ghost:active{transform:translateY(1px)}

    .mission-hud{
      margin:6px 0 14px;
      padding:13px 14px 12px;
      border:1px solid var(--line);
      background:rgba(9,22,37,.72);
      backdrop-filter:blur(12px);
      border-radius:18px;
    }
    .hud-row{
      display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;
    }
    .hud-label{
      font-size:12px;color:var(--muted);letter-spacing:.08em;
    }
    .hud-value{
      color:var(--text);font-weight:800;margin-left:5px;
    }
    .stepper{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }
    .step{
      position:relative;
      height:8px;
      border-radius:999px;
      background:#132033;
      overflow:hidden;
    }
    .step::after{
      content:"";
      position:absolute;inset:0;
      transform:scaleX(0);
      transform-origin:left;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      transition:transform .35s ease;
    }
    .step.done::after{transform:scaleX(1)}
    .step.active::after{transform:scaleX(.52)}
    .clues-mini{display:flex;gap:7px}
    .clue-mini{
      width:25px;height:25px;border-radius:8px;
      display:grid;place-items:center;
      border:1px solid var(--line);
      color:var(--muted-2);
      background:#0a1625;
      font-size:12px;font-weight:800;
    }
    .clue-mini.on{
      color:#062016;
      border-color:transparent;
      background:var(--accent-2);
    }

    .screen{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:12px 0 6px;
      animation:screenIn .28s ease both;
    }
    @keyframes screenIn{
      from{opacity:.32;transform:translateY(8px)}
      to{opacity:1;transform:none}
    }

    .kicker{
      display:inline-flex;
      align-items:center;
      align-self:flex-start;
      gap:8px;
      min-height:28px;
      padding:6px 10px;
      border-radius:999px;
      background:var(--accent-soft);
      color:var(--accent);
      border:1px solid rgba(97,217,255,.18);
      font-size:11px;
      font-weight:850;
      letter-spacing:.10em;
      text-transform:uppercase;
      margin-bottom:15px;
    }
    .kicker-dot{
      width:6px;height:6px;border-radius:50%;background:currentColor;
      box-shadow:0 0 0 4px rgba(97,217,255,.08);
    }

    h1,h2,h3,p{margin-top:0}
    h1,h2{
      letter-spacing:-.042em;
      text-wrap:balance;
    }
    h1{
      font-size:clamp(36px,10vw,58px);
      line-height:1.06;
      margin-bottom:16px;
      font-weight:900;
    }
    h2{
      font-size:clamp(29px,7.6vw,42px);
      line-height:1.14;
      margin-bottom:15px;
      font-weight:850;
    }
    h3{
      font-size:18px;
      letter-spacing:-.02em;
      margin-bottom:7px;
    }
    p{
      font-size:16px;
      line-height:1.72;
      color:#dfebf5;
      margin-bottom:14px;
      word-break:keep-all;
    }
    .lead{
      font-size:17px;
      color:#e8f1f8;
      max-width:34rem;
    }
    .muted{color:var(--muted)}
    .small{font-size:12px;line-height:1.55;color:var(--muted-2)}

    .hero-visual{
      width:100%;
      height:178px;
      margin:8px 0 22px;
      border-radius:var(--radius-xl);
      border:1px solid var(--line);
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 40%,rgba(97,217,255,.14),transparent 32%),
        linear-gradient(145deg,#0a1728,#0f2137);
    }
    .hero-visual::before,
    .hero-visual::after{
      content:"";
      position:absolute;
      border-radius:50%;
      border:1px solid rgba(97,217,255,.23);
      left:50%;top:50%;
      transform:translate(-50%,-50%);
    }
    .hero-visual::before{width:128px;height:128px}
    .hero-visual::after{width:86px;height:86px;border-style:dashed;animation:spin 12s linear infinite}
    @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
    .signal-core{
      position:absolute;
      left:50%;top:50%;
      transform:translate(-50%,-50%);
      width:44px;height:44px;border-radius:50%;
      background:radial-gradient(circle at 35% 35%,#dffaff,var(--accent) 45%,#1e92bf);
      box-shadow:0 0 0 12px rgba(97,217,255,.06),0 0 44px rgba(97,217,255,.38);
    }
    .signal-line{
      position:absolute;
      left:10%;right:10%;top:50%;
      height:1px;background:linear-gradient(90deg,transparent,rgba(97,217,255,.38),transparent);
    }
    .signal-line.v{left:50%;right:auto;top:10%;bottom:10%;width:1px;height:auto}
    .scan{
      position:absolute;left:0;right:0;height:1px;top:18%;
      background:linear-gradient(90deg,transparent,rgba(111,241,194,.72),transparent);
      box-shadow:0 0 15px rgba(111,241,194,.35);
      animation:scan 3s ease-in-out infinite;
    }
    @keyframes scan{50%{top:82%}}

    .panel{
      border:1px solid var(--line);
      background:linear-gradient(180deg,rgba(17,35,58,.88),rgba(11,26,43,.94));
      border-radius:var(--radius-lg);
      padding:20px;
      box-shadow:var(--shadow);
    }
    .panel + .panel{margin-top:12px}
    .panel-head{
      display:flex;align-items:flex-start;gap:13px;
    }
    .panel-icon{
      width:43px;height:43px;display:grid;place-items:center;
      border-radius:14px;flex:0 0 auto;
      color:var(--accent);
      background:var(--accent-soft);
      border:1px solid rgba(97,217,255,.16);
    }
    .panel-icon svg{width:22px;height:22px}
    .panel-body{min-width:0}
    .panel-body p:last-child{margin-bottom:0}

    .rules{
      display:grid;
      gap:10px;
      margin-top:18px;
    }
    .rule{
      display:grid;
      grid-template-columns:34px 1fr;
      gap:12px;
      align-items:center;
      padding:11px 12px;
      border-radius:15px;
      background:rgba(255,255,255,.025);
      border:1px solid rgba(157,185,211,.11);
    }
    .rule-num{
      width:34px;height:34px;border-radius:11px;
      display:grid;place-items:center;
      color:#06151f;background:var(--accent);font-weight:900;font-size:13px;
    }
    .rule strong{font-size:14px}
    .rule span{display:block;color:var(--muted);font-size:12px;margin-top:2px}

    .actions{
      display:grid;
      gap:10px;
      margin-top:22px;
    }
    .btn{
      width:100%;
      min-height:var(--tap);
      border:1px solid transparent;
      border-radius:17px;
      padding:14px 18px;
      font-size:16px;
      font-weight:900;
      letter-spacing:-.01em;
      color:#04141e;
      background:linear-gradient(135deg,var(--accent),#91e9ff);
      box-shadow:0 10px 28px rgba(97,217,255,.16);
      transition:transform .12s ease,filter .12s ease;
    }
    .btn:active{transform:translateY(1px) scale(.995)}
    .btn.secondary{
      color:var(--text);
      border-color:var(--line-strong);
      background:rgba(255,255,255,.025);
      box-shadow:none;
    }
    .btn.good{
      background:linear-gradient(135deg,var(--accent-2),#9af6d6);
      box-shadow:0 10px 28px rgba(111,241,194,.14);
    }

    .story-frame{
      position:relative;
      padding:22px 20px 18px;
      border:1px solid var(--line);
      background:rgba(10,24,40,.72);
      border-radius:var(--radius-xl);
      overflow:hidden;
      min-height:245px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
    }
    .story-frame::before{
      content:"";
      position:absolute;
      width:190px;height:190px;border-radius:50%;
      right:-62px;top:-72px;
      border:1px solid rgba(97,217,255,.14);
      box-shadow:inset 0 0 0 28px rgba(97,217,255,.018),inset 0 0 0 58px rgba(97,217,255,.012);
    }
    .story-index{
      position:absolute;left:20px;top:18px;
      color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.10em;
    }
    .story-copy{
      position:relative;z-index:1;
      font-size:clamp(20px,5.4vw,25px);
      line-height:1.55;
      letter-spacing:-.025em;
      font-weight:650;
      color:#f0f6fa;
      margin:54px 0 0;
      word-break:keep-all;
    }
    .story-dots{
      display:flex;gap:6px;margin-top:19px;
    }
    .story-dot{
      width:7px;height:7px;border-radius:99px;background:#294059;
    }
    .story-dot.on{width:23px;background:var(--accent)}

    .location-card{
      border:1px solid rgba(97,217,255,.24);
      background:
        radial-gradient(circle at 100% 0%,rgba(97,217,255,.10),transparent 17rem),
        linear-gradient(180deg,#0e2035,#0c1c2e);
      border-radius:var(--radius-xl);
      padding:20px;
      margin-top:6px;
      overflow:hidden;
      position:relative;
    }
    .location-top{
      display:flex;align-items:flex-start;gap:14px;position:relative;z-index:1;
    }
    .pin{
      width:48px;height:48px;border-radius:16px;
      display:grid;place-items:center;flex:0 0 auto;
      color:var(--accent);
      background:var(--accent-soft);
      border:1px solid rgba(97,217,255,.18);
    }
    .pin svg{width:25px;height:25px}
    .location-title{font-size:21px;font-weight:900;letter-spacing:-.025em}
    .location-detail{color:var(--muted);font-size:14px;line-height:1.6;margin-top:5px}
    .route{
      margin-top:18px;
      padding-top:15px;
      border-top:1px dashed rgba(157,185,211,.18);
      display:flex;align-items:center;gap:9px;
      color:var(--muted);font-size:12px;
    }
    .route svg{width:17px;height:17px;color:var(--accent-2)}

    .notice{
      display:flex;align-items:flex-start;gap:10px;
      margin-top:14px;
      padding:12px 13px;border-radius:14px;
      color:var(--muted);
      border:1px solid rgba(157,185,211,.12);
      background:rgba(255,255,255,.018);
      font-size:12px;line-height:1.55;
    }
    .notice svg{width:17px;height:17px;flex:0 0 auto;margin-top:1px;color:var(--accent-2)}

    .quiz-card{
      border:1px solid var(--line);
      background:linear-gradient(180deg,#0e1e32,#0a192a);
      border-radius:var(--radius-xl);
      padding:21px 19px;
    }
    .question-no{
      display:inline-flex;align-items:center;gap:8px;
      color:var(--accent-2);font-size:11px;font-weight:850;letter-spacing:.10em;
      margin-bottom:14px;
    }
    .question{
      font-size:21px;
      line-height:1.52;
      font-weight:760;
      letter-spacing:-.028em;
      color:#f4f8fb;
      word-break:keep-all;
      margin-bottom:20px;
    }
    label{
      display:block;
      margin-bottom:8px;
      font-size:12px;
      color:var(--muted);
      font-weight:750;
      letter-spacing:.04em;
    }
    .answer-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:8px;
    }
    input[type=text]{
      width:100%;
      min-width:0;
      min-height:56px;
      border:1px solid var(--line-strong);
      background:#081522;
      color:var(--text);
      border-radius:16px;
      padding:14px 15px;
      font-size:17px;
      outline:none;
    }
    input[type=text]::placeholder{color:#5e7489}
    input[type=text]:focus{
      border-color:rgba(97,217,255,.74);
      box-shadow:0 0 0 4px rgba(97,217,255,.08);
    }
    .check-mini{
      min-width:78px;
      min-height:56px;
      border:0;
      border-radius:16px;
      padding:0 15px;
      font-weight:900;
      color:#04141e;
      background:var(--accent);
    }
    .feedback{
      min-height:23px;
      margin-top:10px;
      font-size:13px;
      line-height:1.45;
    }
    .feedback.good{color:var(--good)}
    .feedback.bad{color:var(--danger)}

    .hint-reveal{
      text-align:center;
      padding:24px 16px 19px;
      border:1px solid rgba(111,241,194,.24);
      background:
        radial-gradient(circle at 50% 40%,rgba(111,241,194,.13),transparent 42%),
        linear-gradient(180deg,#0d2031,#0b1a2b);
      border-radius:var(--radius-xl);
    }
    .clear-ring{
      width:68px;height:68px;border-radius:50%;
      margin:0 auto 14px;
      display:grid;place-items:center;
      border:1px solid rgba(111,241,194,.36);
      background:rgba(111,241,194,.08);
      color:var(--good);
      font-size:13px;font-weight:950;letter-spacing:.08em;
      box-shadow:0 0 0 9px rgba(111,241,194,.025);
    }
    .clue-art{
      width:min(68vw,250px);
      aspect-ratio:1;
      margin:21px auto 15px;
      position:relative;
      display:grid;
      place-items:center;
    }
    .clue-art::before,.clue-art::after{
      content:"";
      position:absolute;border-radius:50%;
      border:1px solid rgba(97,217,255,.22);
    }
    .clue-art::before{inset:4%}
    .clue-art::after{inset:18%;border-style:dashed;animation:spin 12s linear infinite}
    .clue-svg{
      width:44%;height:44%;
      color:var(--accent-2);
      filter:drop-shadow(0 10px 24px rgba(111,241,194,.20));
      position:relative;z-index:1;
    }
    .clue-name{
      font-size:21px;font-weight:900;letter-spacing:-.025em;margin-bottom:7px;
    }

    .clue-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin:16px 0;
    }
    .clue-tile{
      aspect-ratio:1.28/1;
      border-radius:18px;
      border:1px solid var(--line);
      background:#0c1a2c;
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
    }
    .clue-tile::after{
      content:"";
      position:absolute;
      inset:auto 0 0 0;
      height:32%;
      background:linear-gradient(to top,rgba(97,217,255,.04),transparent);
    }
    .clue-tile.locked{color:#4f657a}
    .clue-num{
      position:absolute;left:10px;top:8px;
      color:var(--muted-2);font-size:10px;font-weight:800;letter-spacing:.08em;
    }
    .tile-svg{width:45px;height:45px;color:var(--accent-2)}
    .lock-svg{width:25px;height:25px}
    .clue-label{
      position:absolute;bottom:8px;left:8px;right:8px;
      color:var(--muted);font-size:10px;text-align:center;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }

    .terminal{
      border:1px solid rgba(111,241,194,.20);
      background:#071620;
      border-radius:var(--radius-lg);
      overflow:hidden;
      margin-top:5px;
    }
    .terminal-bar{
      display:flex;align-items:center;gap:6px;
      padding:10px 12px;
      border-bottom:1px solid rgba(111,241,194,.12);
      color:#7fa698;font-size:10px;letter-spacing:.08em;
    }
    .term-dot{width:7px;height:7px;border-radius:50%;background:#345448}
    .terminal-body{
      padding:17px 15px 18px;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      color:#aaf3d8;
      font-size:13px;
      line-height:1.75;
    }
    .terminal-line{opacity:.9}
    .cursor{
      display:inline-block;width:7px;height:14px;vertical-align:-2px;margin-left:4px;
      background:var(--accent-2);
      animation:blink 1s steps(1) infinite;
    }
    @keyframes blink{50%{opacity:0}}

    .complete-badge{
      width:88px;height:88px;border-radius:27px;
      display:grid;place-items:center;
      margin-bottom:20px;
      color:#041b13;
      background:linear-gradient(145deg,var(--accent-2),#a0f8dc);
      box-shadow:0 18px 45px rgba(111,241,194,.20);
    }
    .complete-badge svg{width:43px;height:43px}

    .stats-row{
      display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px;
    }
    .stat{
      padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.022);
    }
    .stat span{display:block;color:var(--muted);font-size:11px}
    .stat strong{display:block;font-size:22px;margin-top:4px}

    .resume-card{
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      background:linear-gradient(180deg,#0e2035,#0a192a);
      padding:20px;
      margin-top:8px;
    }
    .resume-status{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:13px 0 0;
      border-top:1px solid var(--line);
      margin-top:14px;
    }

    .hidden{display:none!important}

    @media (max-width:420px){

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return structuredClone(defaultState);
      const parsed = JSON.parse(raw);
      return {...structuredClone(defaultState), ...parsed};
    }catch{
      return structuredClone(defaultState);
    }
  }

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function resetState(){
    state = structuredClone(defaultState);
    resumeStage = null;
    saveState();
    render();
  }

  function normalizeAnswer(value){
    return String(value || "").trim().replace(/\s+/g,"").toLowerCase();
  }

  function isCorrect(input, accepted){
    const v = normalizeAnswer(input);
    return accepted.some(a => normalizeAnswer(a) === v);
  }

  function setScreen(html){
    screen.innerHTML = html;
    screen.classList.remove("screen");
    void screen.offsetWidth;
    screen.classList.add("screen");
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function isMissionStage(){
    return ["story","location","quiz","hint"].includes(state.stage);
  }

  function updateHud(){
    const show = isMissionStage();
    missionHud.classList.toggle("hidden", !show);
    if(!show) return;

    missionHudLabel.textContent = `MISSION ${String(state.missionIndex + 1).padStart(2,"0")}`;

    cluesMini.innerHTML = state.hints.map((on,i) =>
      `<span class="clue-mini ${on ? "on":""}" aria-label="단서 ${i+1} ${on ? "획득":"미획득"}">${on ? "✓" : i+1}</span>`
    ).join("");

    missionStepper.innerHTML = missions.map((_,i) => {
      let cls = "";
      if(state.completed[i]) cls = "done";
      else if(i === state.missionIndex) cls = "active";
      return `<span class="step ${cls}"></span>`;
    }).join("");
  }

  function progressSummary(){
    const count = state.hints.filter(Boolean).length;
    if(state.finished) return "모든 미션 완료";
    return `MISSION ${String(Math.min(state.missionIndex + 1,4)).padStart(2,"0")} · 단서 ${count}/4`;

    const input = document.getElementById("answerInput");
    const feedback = document.getElementById("feedback");

    const check = ()=>{
      if(!input.value.trim()){
        feedback.className = "feedback bad";
        feedback.textContent = "정답을 입력해 주세요.";
        input.focus();
        return;
      }
      if(isCorrect(input.value,m.answers)){
        feedback.className = "feedback good";
        feedback.textContent = "정답 확인 완료. 새로운 단서를 복원합니다.";
        state.completed[state.missionIndex] = true;
        state.hints[state.missionIndex] = true;
        state.stage = "hint";
        saveState();
        setTimeout(render,420);
      }else{
        feedback.className = "feedback bad";
        feedback.textContent = "신호가 일치하지 않습니다. 전시물을 다시 관찰해 보세요.";
        input.select();
      }
    };

    document.getElementById("checkBtn").addEventListener("click",check);
    input.addEventListener("keydown",e=>{if(e.key==="Enter") check()});
    setTimeout(()=>input.focus(),80);
  }

  function renderHint(){
    const m = missions[state.missionIndex];

    setScreen(`
      <div class="hint-reveal">
        <div class="clear-ring">CLEAR</div>
        <div class="kicker" style="align-self:center"><span class="kicker-dot"></span> Clue Recovered</div>
        <h2 style="margin-bottom:4px">단서 ${state.missionIndex+1} 복원 완료</h2>
        <p class="muted">${m.hintText}</p>

        <div class="clue-art">
          <div class="clue-svg">${icons[m.icon]}</div>
        </div>
        <div class="clue-name">${m.hintTitle}</div>
        <p class="muted">${m.nextGuide}</p>
      </div>

      <div class="actions">
        <button id="nextMissionBtn" class="btn good" type="button">${state.missionIndex < 3 ? "다음 신호 추적" : "최종 암호 분석"}</button>
      </div>
    `);

    document.getElementById("nextMissionBtn").addEventListener("click",()=>{
      if(state.missionIndex < 3){
        state.missionIndex += 1;
        state.storyIndex = 0;
        state.stage = "story";
      }else{
        state.stage = "final";
      }
      saveState();
      render();
    });
  }

  function renderFinal(){
    missionHud.classList.add("hidden");
    const tiles = missions.map((m,i)=>`
      <div class="clue-tile ${state.hints[i] ? "" : "locked"}">
        <span class="clue-num">CLUE ${String(i+1).padStart(2,"0")}</span>
        ${state.hints[i] ? `<div class="tile-svg">${icons[m.icon]}</div><span class="clue-label">${m.hintTitle}</span>` : `<div class="lock-svg">${icons.lock}</div><span class="clue-label">LOCKED</span>`}
      </div>
    `).join("");

    setScreen(`
      <div class="kicker"><span class="kicker-dot"></span> Final Analysis</div>
      <h2>4개의 단서가 하나의 메시지를 가리키고 있습니다</h2>
      <p class="muted">지금까지 복원한 신호를 비교하고 공통된 의미를 찾아보세요.</p>

      <div class="clue-grid">${tiles}</div>

      <div class="quiz-card">
        <div class="question-no">FINAL QUESTION</div>
        <div class="question">${finalQuestion}</div>
        <label for="finalInput">최종 암호</label>
        <div class="answer-row">
          <input id="finalInput" type="text" autocomplete="off" placeholder="최종 정답을 입력하세요" />
          <button id="finalCheckBtn" class="check-mini" type="button">확인</button>
        </div>
        <div id="finalFeedback" class="feedback" aria-live="polite"></div>
      </div>
    `);

    const input = document.getElementById("finalInput");
    const feedback = document.getElementById("finalFeedback");

    const check = ()=>{
      if(!input.value.trim()){
        feedback.className="feedback bad";
        feedback.textContent="최종 정답을 입력해 주세요.";
        input.focus();
        return;
      }
      if(isCorrect(input.value,finalAnswers)){
        feedback.className="feedback good";
        feedback.textContent="암호 일치. 최종 메시지를 해독합니다.";
        state.stage="ending";
        saveState();
        setTimeout(render,520);
      }else{
        feedback.className="feedback bad";
        feedback.textContent="암호가 일치하지 않습니다. 네 단서의 공통점을 다시 생각해 보세요.";
        input.select();
      }
    };

    document.getElementById("finalCheckBtn").addEventListener("click",check);
    input.addEventListener("keydown",e=>{if(e.key==="Enter") check()});
  }

  function renderEnding(){
    missionHud.classList.add("hidden");

    setScreen(`
      <div class="kicker"><span class="kicker-dot"></span> System Unlocked</div>
      <h2>마지막 메시지가 열렸습니다</h2>

      <div class="terminal">
        <div class="terminal-bar">
          <span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span>
          <span style="margin-left:4px">SCIENCE_MISSION / DECODE_LOG</span>
        </div>
        <div class="terminal-body">
          <div class="terminal-line">&gt; SIGNAL MATCHED ........ OK</div>
          <div class="terminal-line">&gt; CLUES RECOVERED ...... 4/4</div>
          <div class="terminal-line">&gt; FINAL MESSAGE ........ OPEN<span class="cursor"></span></div>
        </div>
      </div>

      <div class="panel" style="margin-top:14px">
        ${ending.map((p,i)=>`<p ${i===ending.length-1?'style="margin-bottom:0"':''}>${p}</p>`).join("")}
      </div>

      <div class="actions">
        <button id="endingNextBtn" class="btn good" type="button">탐사 결과 확인</button>
      </div>
    `);

    document.getElementById("endingNextBtn").addEventListener("click",()=>{
      state.stage="complete";
      state.finished=true;
      saveState();
      render();
    });
  }

  function renderComplete(){
    missionHud.classList.add("hidden");

    setScreen(`
      <div class="complete-badge">${icons.check}</div>
      <div class="kicker"><span class="kicker-dot"></span> Mission Complete</div>
      <h1>모든 신호를<br>해독했습니다</h1>
      <p class="lead">4개의 미션을 완료하고 과학관의 마지막 메시지를 찾아냈습니다.</p>

      <div class="clue-grid">
        ${missions.map((m,i)=>`
          <div class="clue-tile">
            <span class="clue-num">CLUE ${String(i+1).padStart(2,"0")}</span>
            <div class="tile-svg">${icons[m.icon]}</div>
            <span class="clue-label">${m.hintTitle}</span>
          </div>
        `).join("")}
      </div>

      <div class="stats-row">
        <div class="stat"><span>미션 완료</span><strong>4 / 4</strong></div>
        <div class="stat"><span>단서 획득</span><strong>4 / 4</strong></div>
      </div>

      <div class="actions">
        <button id="restartBtn" class="btn secondary" type="button">처음부터 다시 탐사하기</button>
      </div>
    `);

    document.getElementById("restartBtn").addEventListener("click",resetState);
  }

  function render(){
    updateHud();

    switch(state.stage){
      case "start": renderStart(); break;
      case "resume": renderResume(); break;
      case "story": renderStory(); break;
      case "location": renderLocation(); break;
      case "quiz": renderQuiz(); break;
      case "hint": renderHint(); break;
      case "final": renderFinal(); break;
      case "ending": renderEnding(); break;
      case "complete": renderComplete(); break;
      default:
        state.stage="start";
        saveState();
        renderStart();
    }
    updateHud();
  }

  resetTopBtn.addEventListener("click",()=>{
    if(confirm("현재 진행 기록을 지우고 처음부터 시작할까요?")) resetState();
  });

  const hasProgress =
    state.finished ||
    state.stage !== "start" ||
    state.missionIndex > 0 ||
    state.storyIndex > 0 ||
    state.completed.some(Boolean);

  if(hasProgress && !state.finished){
    resumeStage = state.stage === "resume" ? "story" : state.stage;
    state.stage = "resume";
    renderResume();
  }else{
    render();
  }
})();
</script>
</body>
</html>
